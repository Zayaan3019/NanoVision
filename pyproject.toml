[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "nanovision"
version         = "0.1.0"
description     = "Vision Transformer + CLIP from scratch, trained on CIFAR-10"
readme          = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "pillow>=9.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]
tensorboard = [
    "tensorboard>=2.13",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["nanovision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
